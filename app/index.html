  <link rel="manifest" href="manifest.webmanifest">

  <link rel="preconnect" href="https://fonts.googleapis.com">

<body>
  <header class="top">
    <h1 class="wordmark">Jus Gentium<span>.</span></h1>
    <div class="top-right">
      <span id="updated">…</span>
      <button id="refresh" class="icon-btn" aria-label="Refresh">
        <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path d="M20 11a8 8 0 1 0-2.3 5.7M20 4v7h-7" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
    </div>
  </header>

  <main id="view" tabindex="-1"></main>

  <nav class="tabs" aria-label="Sections">
    <button data-tab="brief" class="active">
      <span class="ico"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 5h16M4 10h16M4 15h10M4 20h7"/></svg></span><span>Today</span>
    </button>
    <button data-tab="feed">
      <span class="ico"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="4" width="16" height="16" rx="2"/><path d="M8 9h8M8 13h8M8 17h5"/></svg></span><span>All</span>
    </button>
    <button data-tab="saved">
      <span class="ico"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 4h10v16l-5-3.5L7 20z"/></svg></span><span>Reading</span>
    </button>
    <button data-tab="sources">
      <span class="ico"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="8"/><path d="M4 12h16M12 4c2.5 2.5 2.5 13.5 0 16M12 4c-2.5 2.5-2.5 13.5 0 16"/></svg></span><span>Sources</span>
    </button>
  </nav>

  <div id="toast" role="status" aria-live="polite"></div>
  <script src="questions.js"></script>
  <script src="app.js"></script>
</body>
</html>
